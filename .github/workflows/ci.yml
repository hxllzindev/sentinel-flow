name: CI and security gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SentinelFlow.sln
      - run: dotnet build SentinelFlow.sln --configuration Release --no-restore
      - run: dotnet test SentinelFlow.sln --configuration Release --no-build
      - run: python3 -B scripts/frontend-security-test.py

  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.125.0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: semgrep scan --config p/csharp --config p/owasp-top-ten --error --metrics=off

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: false
          tags: sentinel-flow:ci
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: sentinel-flow:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: sentinel-flow:ci
          artifact-name: sentinel-flow.spdx.json

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: docker compose up -d --build
      - run: |
          for attempt in {1..30}; do
            curl --fail http://127.0.0.1:4000/api/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - run: curl --fail http://127.0.0.1:4000/api/summary
      - if: always()
        run: docker compose down
