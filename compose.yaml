services:
  sentinel-flow:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:4000
      ALLOW_INSECURE_DEMO: "true"
    ports:
      - "127.0.0.1:4000:4000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
